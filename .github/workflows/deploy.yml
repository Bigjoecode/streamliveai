# Deploy to Namecheap shared hosting over SFTP on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST     server hostname or IP (cPanel → "Server Information" → Shared IP)
#   SSH_PORT     21098 on Namecheap shared hosting
#   SSH_USER     cPanel username
#   SSH_KEY      passphrase-less private key whose public half is authorised in
#                cPanel → SSH Access
#   DEPLOY_PATH  absolute document root, e.g. /home/<cpaneluser>/streamliveai.art
#
# SFTP only — no shell commands. The account answers the SFTP subsystem but
# refuses shell sessions ("Shell access is not enabled"), same as mejortechworld.
#
# Only git-tracked files ship, so the server's own inc/config.local.php and
# storage/ data are never touched. Files are added/overwritten, never deleted.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Secrets pasted through a browser often carry stray spaces or CRLFs.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::'; }
          for v in SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            val="$(trim "${!v}")"
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_KEY is not a valid private key, or it has a passphrase. Use a key generated with an empty passphrase."
            exit 1
          fi
          ssh-keyscan -p "$(trim "$SSH_PORT")" -H "$(trim "$SSH_HOST")" >> ~/.ssh/known_hosts

      - name: Upload over SFTP
        run: |
          # Repo-only files that never ship.
          skip='^(\.github/|LOCAL-SETUP\.md$|dev-router\.php$|\.gitattributes$)|(^|/)\.gitignore$'
          git ls-files | grep -Ev "$skip" > files.txt

          q() { printf '"%s"' "$1"; }
          {
            # "-" lets mkdir fail quietly when the directory already exists.
            sed -n 's:/[^/]*$::p' files.txt | sort -u | awk -F/ '{p=""; for(i=1;i<=NF;i++){p=p (i>1?"/":"") $i; print p}}' | sort -u \
              | while read -r d; do echo "-mkdir $(q "$DEPLOY_PATH/$d")"; done
            while read -r f; do echo "put $(q "$f") $(q "$DEPLOY_PATH/$f")"; done < files.txt
          } > batch.txt
          echo "Uploading $(wc -l < files.txt) files"

          sftp -q -b batch.txt -i ~/.ssh/id_deploy -P "$SSH_PORT" "$SSH_USER@$SSH_HOST"

      - name: Smoke test
        run: |
          # The login page is PHP behind a clean-URL rewrite, so a 200 proves the
          # upload landed in the live docroot and that PHP and .htaccess both work.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://streamliveai.art/login)
          echo "GET /login → $code"
          [ "$code" = 200 ] || { echo "::warning::/login returned $code — check DEPLOY_PATH and inc/config.local.php"; }
