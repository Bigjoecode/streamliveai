# Deploy to Namecheap shared hosting over SSH on every push to main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST     server hostname or IP (cPanel → "Server Information" → Shared IP)
#   SSH_PORT     21098 on Namecheap shared hosting
#   SSH_USER     cPanel username
#   SSH_KEY      private key whose public half is authorised in cPanel → SSH Access
#   DEPLOY_PATH  absolute target dir, e.g. /home/<cpaneluser>/public_html
#
# Server-only files are never touched: inc/config.local.php (keys), storage/
# (sessions, SQLite, logs, outputs) and ops-dashboard runtime cache/data.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Secrets pasted through a browser often carry stray spaces or CRLFs.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          for v in SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            val="$(trim "${!v}")"
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SSH_KEY is not a valid private key, or it has a passphrase. Use a key generated with an empty passphrase."
            exit 1
          fi
          ssh-keyscan -p "$(trim "$SSH_PORT")" -H "$(trim "$SSH_HOST")" >> ~/.ssh/known_hosts

      - name: Upload to server
        run: |
          # tar over ssh rather than rsync: shared-host login shells print banners,
          # which break rsync's protocol but can't corrupt a tar stream on stdin.
          # Files are only added/overwritten — the target may hold files this repo
          # doesn't own. Repo-only files below never ship, and the server's own
          # config.local.php and storage/ are left alone.
          tar -czf - \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./.gitignore \
            --exclude=./.gitattributes \
            --exclude=./dev-router.php \
            --exclude=./LOCAL-SETUP.md \
            --exclude=./inc/config.local.php \
            --exclude=./storage \
            --exclude=./ops-dashboard/cache \
            --exclude=./ops-dashboard/data \
            . \
          | ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$DEPLOY_PATH' && tar -xzf - --no-same-owner -C '$DEPLOY_PATH'"

      - name: Ensure runtime dirs exist
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "
            cd '$DEPLOY_PATH' &&
            mkdir -p storage ops-dashboard/cache ops-dashboard/data &&
            [ -f storage/.htaccess ] || printf 'Require all denied\n' > storage/.htaccess
          "
